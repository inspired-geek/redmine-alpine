<% require "json" %>
<% yaml_string = ->(value) { JSON.generate(value).gsub(/[\u007f-\u009f]/) { |character| "\\u%04X" % character.ord } } %>
<% secret_key_base = ENV.fetch("SECRET_KEY_BASE") { ENV.fetch("REDMINE_SECRET_KEY_BASE") } %>
<% raise ArgumentError, "SECRET_KEY_BASE must not be empty" if secret_key_base.empty? %>
production:
  secret_key_base: <%= yaml_string.call(secret_key_base) %>
